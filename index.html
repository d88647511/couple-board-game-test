<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 夫妻人生旅程 Wedding Edition</title>

    <link rel="stylesheet" href="style.css?v=17">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="drift-cloud c1" aria-hidden="true"></div>
    <div class="drift-cloud c2" aria-hidden="true"></div>
    <div class="drift-cloud c3" aria-hidden="true"></div>

<div id="background-hearts"></div>

<header class="topBar">

    <div class="couple-avatar" aria-hidden="true"></div>

    <div class="titleArea">

        <h1>💕 夫妻人生旅程 💕</h1>

        <div class="subtitle">
            Wedding Board Game
        </div>

    </div>

    <div id="turnPanel">

        <div class="label">
            目前隊伍
        </div>

        <div id="currentTeam">
            第一隊
        </div>

    </div>

</header>

<main>

<section id="boardSection">

<div id="boardViewport">

<div id="boardContainer">

<div id="boardTilt">







<svg id="roadLayer"></svg>

<div id="board">

<!-- S 型蜿蜒道路的旅程事件站，由 JS 依道路座標建立 -->

</div>

<div id="pieceLayer">

<div class="piece red" id="piece0">
    <div class="piece-shadow"></div>
    <div class="piece-figure">
        <div class="piece-doll">
            <img class="piece-img frame-a" alt="">
            <img class="piece-img frame-b" alt="">
        </div>
    </div>
</div>

<div class="piece blue" id="piece1">
    <div class="piece-shadow"></div>
    <div class="piece-figure">
        <div class="piece-doll">
            <img class="piece-img frame-a" alt="">
            <img class="piece-img frame-b" alt="">
        </div>
    </div>
</div>

<div class="piece green" id="piece2">
    <div class="piece-shadow"></div>
    <div class="piece-figure">
        <div class="piece-doll">
            <img class="piece-img frame-a" alt="">
            <img class="piece-img frame-b" alt="">
        </div>
    </div>
</div>

<div class="piece yellow" id="piece3">
    <div class="piece-shadow"></div>
    <div class="piece-figure">
        <div class="piece-doll">
            <img class="piece-img frame-a" alt="">
            <img class="piece-img frame-b" alt="">
        </div>
    </div>
</div>

<div class="piece purple" id="piece4">
    <div class="piece-shadow"></div>
    <div class="piece-figure">
        <div class="piece-doll">
            <img class="piece-img frame-a" alt="">
            <img class="piece-img frame-b" alt="">
        </div>
    </div>
</div>

</div>

</div>

</div>

</div>

</section>

<aside id="rightPanel">

<div class="card">

<h2>
隊伍設定
</h2>

<div class="teamCountRow">
<button type="button" id="teamCountMinus" class="teamCountBtn">−</button>
<span class="teamCountLabel">隊伍 <strong id="teamCountNum">5</strong></span>
<button type="button" id="teamCountPlus" class="teamCountBtn">＋</button>
</div>

<div class="teamInput" id="teamRow0">

    <span class="dot red"></span>

    <input
        id="team0"
        type="text"
        value="第一隊">

    <span class="teamScore" id="teamScore0">
        0
    </span>

</div>

<div class="teamInput" id="teamRow1">

<span class="dot blue"></span>

<input
id="team1"
type="text"
value="第二隊">
<span class="teamScore" id="teamScore1">0</span>

</div>

<div class="teamInput" id="teamRow2">

<span class="dot green"></span>

<input
id="team2"
type="text"
value="第三隊">
<span class="teamScore" id="teamScore2">0</span>

</div>

<div class="teamInput" id="teamRow3">

<span class="dot yellow"></span>

<input
id="team3"
type="text"
value="第四隊">
<span class="teamScore" id="teamScore3">0</span>

</div>

<div class="teamInput" id="teamRow4">

<span class="dot purple"></span>

<input
id="team4"
type="text"
value="第五隊">
<span class="teamScore" id="teamScore4">0</span>

</div>
<button type="button" id="musicBtn">🎵 播放音樂</button>

</div>

<div class="card">

<h2>
🎲 骰子
</h2>

<div id="dice">

1

</div>

<button type="button" id="rollBtn">🎲 擲骰</button>

<button type="button" id="nextBtn">

➡ 下一隊

</button>


</div>

<div class="card">

<h2>

💕 題目

</h2>

<div id="questionBox">

按下擲骰開始遊戲

</div>

</div>

<div class="card">

<h2>

🏆 計分

</h2>

<div id="scoreBoard">

<div class="scoreRow" id="scoreRow0">

<span id="scoreName0">

第一隊

</span>

<span id="score0">

0

</span>

</div>

<div class="scoreRow" id="scoreRow1">

<span id="scoreName1">

第二隊

</span>

<span id="score1">

0

</span>

</div>

<div class="scoreRow" id="scoreRow2">

<span id="scoreName2">

第三隊

</span>

<span id="score2">

0

</span>

</div>

<div class="scoreRow" id="scoreRow3">

<span id="scoreName3">

第四隊

</span>

<span id="score3">

0

</span>

</div>

<div class="scoreRow" id="scoreRow4">

<span id="scoreName4">

第五隊

</span>

<span id="score4">

0

</span>

</div>

</div>

<button type="button" id="countdownBtn">

⏱ 開始作答

</button>

<button type="button" id="undoBtn">
↩️ 上一步
</button>
<button type="button" id="winnerBtn">
🏆 總分結算
</button>

</div>

</aside>

</main>

<div id="countdownOverlay">

<div id="countdownNumber">

10

</div>

</div>
<!-- =========================
     題目全螢幕
========================= -->

<div id="questionOverlay">

    <div id="questionCard">

        <h2>💕 本回合題目</h2>

        <div id="overlayQuestion">

            題目

        </div>

        <div class="questionButtonArea">

            <button type="button" id="startAnswerBtn">

                ▶ 開始作答

            </button>

            <button type="button" id="correctBtn">

                ✅ +1 分

            </button>

            <button type="button" id="excellentBtn">

                🌟 +2 分

            </button>

            <button type="button" id="closeQuestionBtn">

                ✖ 關閉

            </button>

        </div>

    </div>

</div>
<audio id="bgm" src="bgm.mp3" loop preload="auto"></audio>

<div id="winnerOverlay">

    <div id="winnerTitle">
        🏆 冠軍誕生 🏆
    </div>

    <div id="winnerName"></div>

    <div id="winnerScore"></div>

    <button type="button" id="closeWinner">
        關閉
    </button>

</div>

<div id="godOverlay">
    <div class="god-glow"></div>
    <div class="god-particles">
        <span class="god-p" style="left:15%;animation-delay:0s"></span>
        <span class="god-p" style="left:30%;animation-delay:.4s"></span>
        <span class="god-p" style="left:48%;animation-delay:.8s"></span>
        <span class="god-p" style="left:65%;animation-delay:.2s"></span>
        <span class="god-p" style="left:82%;animation-delay:.6s"></span>
        <span class="god-p" style="left:22%;animation-delay:1s"></span>
        <span class="god-p" style="left:55%;animation-delay:1.2s"></span>
        <span class="god-p" style="left:75%;animation-delay:.3s"></span>
    </div>
    <div class="god-center">
        <div class="god-icon"></div>
        <div class="god-phase1" style="opacity:1;transition:opacity .5s">✝️ 遇見神</div>
        <div class="god-phase2" style="opacity:0;transition:opacity .5s">在婚姻旅程中，神與你們同行</div>
    </div>
</div>

<div id="trialOverlay">
    <div class="trial-fog"></div>
    <div class="trial-fog trial-fog2"></div>
    <div class="trial-lightning"></div>
    <div class="trial-center">
        <div class="trial-icon"></div>
        <div class="trial-phase1" style="opacity:1;transition:opacity .5s">🌑 婚姻試煉</div>
        <div class="trial-phase2" style="opacity:0;transition:opacity .5s">婚姻中會遇見風雨，但你們可以一起面對</div>
    </div>
</div>

<div id="repairVerseOverlay">
    <div class="rv-glow"></div>
    <div class="rv-particles">
        <span class="rv-p" style="left:12%;animation-delay:0s"></span>
        <span class="rv-p" style="left:28%;animation-delay:.6s"></span>
        <span class="rv-p" style="left:50%;animation-delay:1.2s"></span>
        <span class="rv-p" style="left:72%;animation-delay:.3s"></span>
        <span class="rv-p" style="left:88%;animation-delay:.9s"></span>
    </div>
    <div class="rv-card">
        <div class="rv-verse" id="rvVerse"></div>
        <div class="rv-ref" id="rvRef"></div>
    </div>
</div>

<div id="trialFailOverlay">
    <div class="tf-fog"></div>
    <div class="tf-fog tf-fog2"></div>
    <div class="tf-lightning"></div>
    <div class="tf-center">
        <div class="tf-icon"></div>
        <div class="tf-phase1">🌧️ 試煉失敗</div>
        <div class="tf-phase2">婚姻試煉失敗</div>
    </div>
</div>

<div id="blessingLeadOverlay">
    <div class="bl-glow"></div>
    <div class="bl-particles">
        <span class="bl-p" style="left:10%;animation-delay:0s"></span>
        <span class="bl-p" style="left:25%;animation-delay:.5s"></span>
        <span class="bl-p" style="left:42%;animation-delay:1s"></span>
        <span class="bl-p" style="left:58%;animation-delay:.3s"></span>
        <span class="bl-p" style="left:75%;animation-delay:.8s"></span>
        <span class="bl-p" style="left:90%;animation-delay:1.3s"></span>
    </div>
    <div class="bl-text">神要在這段旅程中祝福你的婚姻。</div>
</div>

<div id="bottomBar">
    <span class="bar-btn" id="sfxBtn">&#128266; 音效</span>
    <span class="bar-btn" id="qBtn">&#10067; 題目</span>
    <span class="bar-btn" id="scoreBtn">&#127942; 記分板</span>
    <span class="bar-btn" id="rulesBtn">&#128203; 規則</span>
    <span class="bar-btn" id="homeBtn">&#127968; 返回大廳</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="god-sound-data.js?v=1"></script>
<script src="trial-sound-data.js?v=1"></script>
<script src="couple-data.js?v=1"></script>
<script src="bg-data.js?v=1"></script>
<script src="pawn-data.js?v=3"></script>
<script type="module" src="script.js?v=19"></script>
</body>
</html>
