<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>骰子遙控器</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffe6ef;
    font-family:sans-serif;
}

button{
    width:90%;
    max-width:400px;
    height:180px;
    font-size:50px;
    border:none;
    border-radius:30px;
    background:#ff4f8f;
    color:white;
}

@keyframes bounce {
    0%   { transform: scale(1); }
    15%  { transform: scale(1.12); }
    30%  { transform: scale(0.92); }
    45%  { transform: scale(1.06); }
    60%  { transform: scale(0.96); }
    75%  { transform: scale(1.02); }
    100% { transform: scale(1); }
}

button.bounce {
    animation: bounce 350ms ease-out;
}

@media (prefers-reduced-motion: reduce) {
    button.bounce { animation: none; }
}

</style>

</head>
<body>

<button id="rollBtn">
🎲 擲骰
</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg-YvvfUNvJNDYlzyd2bA0MuWXotvz5sg",
  authDomain: "couple-board-game.firebaseapp.com",
  databaseURL: "https://couple-board-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "couple-board-game",
  storageBucket: "couple-board-game.firebasestorage.app",
  messagingSenderId: "133501507868",
  appId: "1:133501507868:web:17396fe377a37fe83302d9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playClickSound() {
    if (audioCtx.state === "suspended") audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}

document.getElementById("rollBtn").onclick = async () => {

    console.log("按鈕被按了");

    const btn = document.getElementById("rollBtn");

    btn.classList.add("bounce");
    btn.addEventListener("animationend", () => btn.classList.remove("bounce"), { once: true });

    btn.style.background = "#ff99bb";
    setTimeout(() => btn.style.background = "", 100);

    playClickSound();

    if (navigator.vibrate) {
        const ok = navigator.vibrate(200);
        console.log("震動觸發:", ok);
    } else {
        console.log("此裝置不支援 navigator.vibrate");
    }

    const timestamp = Date.now();
    await set(ref(db, "remote/roll"), timestamp);

    console.log("已寫入 timestamp:", timestamp);

};

</script>

</body>
</html>
