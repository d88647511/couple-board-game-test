<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>骰子遙控器</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:#ffe6ef;
    font-family:sans-serif;
}

.dice-container {
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:30px;
}

.dice-icon {
    font-size:160px;
    line-height:1;
    user-select:none;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
}

.dice-icon.rolling {
    animation: diceRoll 1000ms cubic-bezier(0.15, 0.5, 0.35, 1) forwards;
}

@keyframes diceRoll {
    0%   { transform: rotate(0deg) scale(1); }
    10%  { transform: rotate(180deg) scale(1.05); }
    25%  { transform: rotate(540deg) scale(1.05); }
    45%  { transform: rotate(1080deg) scale(1.02); }
    65%  { transform: rotate(1620deg) scale(1.0); }
    80%  { transform: rotate(2040deg) scale(1.0); }
    90%  { transform: rotate(2280deg) scale(1.0); }
    95%  { transform: rotate(2400deg) scale(1.0); }
    100% { transform: rotate(2460deg) scale(1); }
}

.dice-label {
    margin-top:12px;
    font-size:22px;
    color:#ff4f8f;
    text-align:center;
    line-height:1.4;
}

button{
    width:90%;
    max-width:400px;
    height:180px;
    font-size:50px;
    border:none;
    border-radius:30px;
    background:#ff4f8f;
    color:white;
}

button:active {
    background:#e8457d;
}

.permission-btn {
    background:#ffb3d1 !important;
    color:#cc2d6d !important;
    font-size:28px !important;
    height:120px !important;
    margin-top:20px;
}

.hidden {
    display:none !important;
}

@media (prefers-reduced-motion: reduce) {
    .dice-icon.rolling { animation: none; }
}

</style>

</head>
<body>

<div class="dice-container">
    <div id="diceIcon" class="dice-icon">🎲</div>
    <div id="diceLabel" class="dice-label">甩動手機即可擲骰</div>
</div>

<button id="rollBtn">🎲 點我擲骰</button>

<button id="permissionBtn" class="permission-btn hidden">點擊啟用甩動控制</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBg-YvvfUNvJNDYlzyd2bA0MuWXotvz5sg",
  authDomain: "couple-board-game.firebaseapp.com",
  databaseURL: "https://couple-board-game-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "couple-board-game",
  storageBucket: "couple-board-game.firebasestorage.app",
  messagingSenderId: "133501507868",
  appId: "1:133501507868:web:17396fe377a37fe83302d9"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const diceIcon = document.getElementById("diceIcon");
const diceLabel = document.getElementById("diceLabel");
const rollBtn = document.getElementById("rollBtn");
const permissionBtn = document.getElementById("permissionBtn");

const diceSound = new Audio("dice.mp3");
diceSound.volume = 0.8;

let shakePermissionGranted = false;
let shakeEnabled = false;
let lastShakeTime = 0;
const SHAKE_COOLDOWN = 1000;
const SHAKE_THRESHOLD = 25;

function playDiceSound() {
    diceSound.currentTime = 0;
    diceSound.play().catch(() => {});
}

function triggerDiceAnimation() {
    diceIcon.classList.add("rolling");
    diceIcon.addEventListener("animationend", () => diceIcon.classList.remove("rolling"), { once: true });
}

async function sendRollCommand() {
    const timestamp = Date.now();
    await set(ref(db, "remote/roll"), timestamp);
    console.log("已寫入 timestamp:", timestamp);
}

async function rollDice() {
    console.log("執行擲骰");
    playDiceSound();
    triggerDiceAnimation();
    await sendRollCommand();
}

function handleShakeEvent(event) {
    if (!shakeEnabled) return;
    if (!shakePermissionGranted) return;

    const now = Date.now();
    if (now - lastShakeTime < SHAKE_COOLDOWN) return;

    const accel = event.accelerationIncludingGravity;
    if (!accel) return;

    const magnitude = Math.sqrt(accel.x * accel.x + accel.y * accel.y + accel.z * accel.z);
    const delta = Math.abs(magnitude - 9.81);

    if (delta > SHAKE_THRESHOLD) {
        lastShakeTime = now;
        console.log("偵測到甩動:", delta.toFixed(2));
        rollDice();
    }
}

async function requestShakePermission() {
    if (typeof DeviceMotionEvent === "undefined") {
        diceLabel.textContent = "目前裝置不支援甩動控制，請按下方按鈕擲骰。";
        permissionBtn.classList.add("hidden");
        return;
    }

    if (typeof DeviceMotionEvent.requestPermission === "function") {
        try {
            const permission = await DeviceMotionEvent.requestPermission();
            if (permission === "granted") {
                shakePermissionGranted = true;
                enableShakeDetection();
                permissionBtn.classList.add("hidden");
                diceLabel.textContent = "甩動手機即可擲骰";
            } else {
                diceLabel.textContent = "未授權甩動權限，請按下方按鈕擲骰。";
            }
        } catch (e) {
            console.error("權限請求失敗:", e);
            diceLabel.textContent = "權限請求失效，請按下方按鈕擲骰。";
        }
    } else {
        shakePermissionGranted = true;
        enableShakeDetection();
        permissionBtn.classList.add("hidden");
        diceLabel.textContent = "甩動手機即可擲骰";
    }
}

function enableShakeDetection() {
    if (shakeEnabled) return;
    window.addEventListener("devicemotion", handleShakeEvent);
    shakeEnabled = true;
    console.log("甩動偵測已啟用");
}

function disableShakeDetection() {
    window.removeEventListener("devicemotion", handleShakeEvent);
    shakeEnabled = false;
}

rollBtn.onclick = async () => {
    console.log("按鈕被按了");
    rollBtn.style.background = "#ff99bb";
    setTimeout(() => rollBtn.style.background = "", 100);

    if (navigator.vibrate) {
        navigator.vibrate(200);
    }

    await rollDice();
};

permissionBtn.onclick = requestShakePermission;

// 初始化：三種情況互斥
if (typeof DeviceMotionEvent === "undefined") {
    // 完全不支援 DeviceMotionEvent
    diceLabel.textContent = "目前裝置不支援甩動控制，請按下方按鈕擲骰。";
    permissionBtn.classList.add("hidden");
} else if (typeof DeviceMotionEvent.requestPermission === "function") {
    // iOS 13+：需要請求權限
    permissionBtn.classList.remove("hidden");
    diceLabel.textContent = "點擊上方按鈕啟用甩動控制";
} else {
    // Android / 其他：直接啟用
    shakePermissionGranted = true;
    enableShakeDetection();
    permissionBtn.classList.add("hidden");
    diceLabel.textContent = "甩動手機即可擲骰";
}

</script>

</body>
</html>
